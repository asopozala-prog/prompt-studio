<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Silas Studio Prompt Bank</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="studio">
    <img
      class="studio-background"
      src="assets/visual/background_promptStudio.png"
      alt=""
    />

    <img
      class="silas"
      src="assets/visual/Silas_typing.svg"
      alt="Silas typing"
      role="button"
      tabindex="0"
      aria-label="Show Silas’s welcome message"
      aria-controls="silas-welcome"
      aria-expanded="false"
      title="Meet Silas"
    />
  
    <div class="book-flight-layer" aria-hidden="true">
      <img
        class="floating-book book-01"
        src="assets/visual/promptStudio_books_01.svg"
        alt=""
      />
      <img
        class="floating-book book-02"
        src="assets/visual/promptStudio_books_02.svg"
        alt=""
      />
      <img
        class="floating-book book-03"
        src="assets/visual/promptStudio_books_03.svg"
        alt=""
      />
    </div>

  
    <section class="welcome-box" id="silas-welcome" aria-live="polite">
      <p>
        Welcome to Computing Forest, home of the Mushroom House AI Studio.
        This is our private prompt library for Dany’s ML/AI automation work—but since
        you’ve found your way here, consider yourself our guest. You may peek inside
        a few of our books. 🍄🦊
      </p>
    </section>

  
    <section class="book-dialogue" aria-live="polite">
      <strong class="book-dialogue-title"></strong>
      <span class="book-dialogue-text"></span>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
